[project]
name = "fantaoracle"
version = "0.2.0"
description = "Framework dati per asta e formazioni del fantacalcio: raccolta, database, proiezioni, tool di costruzione rosa"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=14",
    "pyyaml>=6",
    "requests>=2.31",
    "rapidfuzz>=3.5",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fantaoracle = "fantaoracle.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fantaoracle*"]
