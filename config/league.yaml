# Regole della lega. Unica fonte di verita': nessuna regola va scritta nel codice.
#
# I campi con valore `PENDING` non sono ancora stati confermati. Il codice che ne
# ha bisogno solleva un errore esplicito che dice quale campo manca, invece di
# usare un default silenzioso che poi falsa tutte le proiezioni.
#
# I bonus/malus qui sotto sono la tabella classica Fantacalcio.it, verificata sul
# regolamento ufficiale. Valgono per la quasi totalita' delle leghe e sono gia'
# compilati. Restano PENDING solo i campi che NON hanno un valore standard,
# perche' sono scelte di chi ha creato la lega.

meta:
  nome: "Lega da definire"
  stagione: "2026-27"
  data_asta: PENDING          # es. 2026-10-24

formato:
  # Nessuno di questi ha un default: dipende da come e' stata creata la lega.
  n_squadre: 8
  crediti_iniziali: 500       # in linea con la taratura del listone
  modalita: classic
  slot:                       # 3-8-8-6 e' la rosa standard da 25
    P: 3
    D: 8
    C: 8
    A: 6

punteggio:
  # h2h: ogni giornata si affronta un avversario, il punteggio diventa un
  # risultato tramite soglie_gol. Conseguenza: l'obiettivo settimanale e'
  # P(battere QUELLO avversario), non il punteggio atteso.
  tipo: h2h
  # Redazione che assegna i voti. Il modello va allenato su questa e non su
  # altre: i voti di redazioni diverse non sono confrontabili fra loro.
  fonte_voti: fantacalcio_it  # redazione giornalistica Fantacalcio.it
  tipo_assist: redazionali    # standard Fantacalcio.it

  # Conversione punteggio -> gol, usata solo nelle leghe h2h.
  # Standard: primo gol a 66, poi uno ogni 6 punti.
  soglie_gol: [66, 72, 78, 84, 90, 96, 102]

bonus:
  # Tabella classica Fantacalcio.it, verificata sul regolamento ufficiale.
  gol_segnato: 3              # anche su rigore, indipendente dal ruolo
  gol_subito: -1              # si applica al portiere
  assist: 1
  rigore_segnato: 3           # stesso valore di un gol su azione
  rigore_sbagliato: -3
  rigore_parato: 3
  autogol: -2
  ammonizione: -0.5
  espulsione: -1
  portiere_imbattuto: 1

modificatori:
  difesa:
    attivo: true
    # Media dei VOTI PURI (senza bonus/malus) di portiere + 3 migliori difensori.
    # Si attiva solo schierando almeno 4 difensori piu' il portiere.
    base_calcolo: 4
    include_portiere: true
    n_difensori: 3
    # Tabella a gradini: [media_voto_minima, bonus]. Il motore la applica DENTRO
    # ogni simulazione, mai sulla media attesa: con una funzione a gradini
    # E[f(X)] != f(E[X]).
    #
    # Tabella classica a tre fasce, quella di default su Fantacalcio.it.
    # Sotto la prima soglia il modificatore non assegna nulla: non ci sono malus.
    soglie: [[6.0, 1], [6.5, 3], [7.0, 6]]
    #
    # Nota: su altre piattaforme esiste un modificatore chiamato anch'esso
    # "classico" che funziona in modo diverso — agisce come malus all'avversario,
    # esclude il portiere e prevede valori negativi sotto il 5,50. Non e' questo.
    # Se nella tua lega compaiono valori negativi per medie basse, e' quello e va
    # cambiata la tabella.

  # Dedotti da "classic con modificatore difesa": solo la difesa e' attiva.
  # Se la lega ne usa altri, basta attivarli qui.
  centrocampo:
    attivo: false
  portiere:
    attivo: false

# Opzione Switch (Fantacalcio.it). Si designano un titolare schierato e un
# panchinaro: se il titolare NON parte nell'undici iniziale della sua squadra
# reale, lo scambio avviene prima della partita. Non conta come sostituzione,
# e' un cambio di formazione antecedente. Utilizzabile una volta a giornata.
#
# Nota per il motore: il trigger e' "non parte titolare", che e' una quantita'
# diversa da "non prende voto" su cui agisce la sostituzione normale dalla
# panchina. Vanno tenute distinte nella simulazione, ma l'effetto sui prezzi
# d'asta e' di secondo ordine: entra come piccola riduzione del rischio
# titolarita', non come leva strategica.
switch:
  attivo: true
  versione: basic             # solo coppie pari ruolo, nessun cambio modulo
  usi_per_giornata: 1

asta:
  # A chiamata per ruolo: prima tutti i portieri, poi difensori, centrocampisti,
  # attaccanti. Si chiama a giro attorno al tavolo; il verso (orario o antiorario)
  # e chi comincia si scelgono nel tool all'avvio dell'asta e si correggono dal vivo.
  tipo: a_giro                # chiamata_libera | a_giro
  ordine_ruoli: [P, D, C, A]  # oppure "libero"
  prezzo_minimo: 1

# Mercato della nostra asta: come si discosta dalle valutazioni medie.
mercato:
  # Maggiorazione del prezzo atteso per i giocatori delle squadre con piu' tifosi
  # fra gli avversari. Peso basso di proposito: piu' romanisti che laziali.
  # I crediti spesi qui mancano altrove: il resto del listone costa un po' meno.
  tifo:
    roma: 0.06
    lazio: 0.03
  # Tetto di giocatori della stessa squadra reale nella rosa suggerita.
  max_per_squadra: 3
  # Il blocco portieri (piu' portieri della stessa squadra) e' escluso dal tetto.
  blocco_portieri_esente: true

# Parametri del motore, non della lega. Modificabili liberamente.
motore:
  n_simulazioni: 10000
  seed: 20261020
  giornate_totali: 38
