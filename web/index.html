<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>FantaOracle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="tool.css?v=e7a9ef79f7">
<div class="app">
  <header class="top">
    <div class="marca">
      <img class="logo" src="logo.png" alt="" width="64" height="68">
      <img class="logo logo-asta" src="logo-asta.png" alt="" width="64" height="68">
      <div class="marca-txt">
        <h1 class="brand" aria-label="FantaOracle"><span>Fanta</span><img class="o-sfera" src="o-sfera.png" alt="" width="28" height="28"><img class="o-sfera o-asta" src="o-sfera-asta.png" alt="" width="28" height="28">racle</h1>
        <div class="meta" id="meta">Carico i dati…</div>
      </div>
    </div>
    <div class="tabellone" id="tabellone"></div>
    <div class="budget" id="budget"></div>
    <div id="asta-ctl"></div>
  </header>
  <nav class="tabs" role="tablist">
    <button id="tab-asta" role="tab" aria-selected="false" data-view="asta" hidden>Asta</button>
    <button id="tab-listone" role="tab" aria-selected="true" data-view="listone"><span class="solo-desk">Listone e rosa</span><span class="solo-mob">Listone</span></button>
    <button id="tab-rosa" class="solo-mob" role="tab" aria-selected="false" data-view="rosa">La mia rosa</button>
  </nav>

  <main class="main" id="main" data-view="listone">
    <section class="pane p-listone" aria-label="Listone">
      <div class="tools">
        <input id="q" type="search" placeholder="Cerca un giocatore" aria-label="Cerca un giocatore">
        <div class="seg" id="ruoli" role="group" aria-label="Ruolo">
          <button data-r="" aria-pressed="true">Tutti</button>
          <button data-r="P" aria-pressed="false">P</button>
          <button data-r="D" aria-pressed="false">D</button>
          <button data-r="C" aria-pressed="false">C</button>
          <button data-r="A" aria-pressed="false">A</button>
        </div>
        <select id="sq" aria-label="Squadra"><option value="">Tutte le squadre</option></select>
        <input id="pmax" type="number" min="1" placeholder="Prezzo max" aria-label="Prezzo atteso massimo">
        <label class="toggle"><input id="hide" type="checkbox"><span id="hide-lbl">Nascondi gli esclusi</span></label>
        <span class="count" id="count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th title="Posizione nell'ordinamento scelto, dentro il ruolo selezionato">#</th>
            <th class="l">R</th>
            <th class="l" data-k="nome">Giocatore</th>
            <th class="l hide-s" data-k="sq">Squadra</th>
            <th data-k="pg" title="Punti attesi a giornata: presenze x fantavoto atteso">Pt/g</th>
            <th data-k="fm" class="hide-s" title="Fantavoto atteso quando gioca">FM att.</th>
            <th data-k="pv" class="hide-s" title="Probabilita' di prendere voto">Pres.</th>
            <th data-k="qa" class="hide-s" title="Quotazione attuale Fantacalcio.it">QA</th>
            <th data-k="val" title="Quanto vale per noi, in crediti">Valore</th>
            <th data-k="pa" title="Prezzo atteso nella nostra asta">Prezzo</th>
            <th data-k="aff" title="Valore meno prezzo atteso">Affare</th>
            <th></th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="12" class="l loading">Carico il listone…</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="pane p-rosa" aria-label="La mia rosa">
      <div class="rosa" id="rosa"></div>
    </section>

    <section class="pane p-asta" aria-label="Asta">
      <div class="asta">
        <div>
          <div class="card" id="occasioni"></div>
          <div class="card" id="chiamata">
            <h2>Giocatore chiamato</h2>
            <div class="cerca">
              <input id="cerca-asta" type="search" autocomplete="off" placeholder="Scrivi il nome del giocatore chiamato" aria-label="Giocatore chiamato">
              <div class="risultati" id="risultati" hidden></div>
            </div>
            <div id="chiamato"></div>
          </div>
        </div>
        <div>
          <div class="card" id="squadre"></div>
          <div class="card" id="log"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="overlay" id="overlay" hidden></div>

<script src="tool.js?v=004dc30f28"></script>

</body>
</html>
