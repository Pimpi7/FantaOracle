# Pubblica il tool (cartella src/web/) su GitHub Pages.
# Parte a ogni modifica del tool e dopo ogni aggiornamento automatico dei dati:
# un push fatto da un workflow non avvia altri workflow, quindi serve workflow_run.
name: Pubblica il tool

on:
  push:
    branches: [main]
    paths: ["src/web/**"]
  workflow_run:
    workflows: ["Aggiorna i dati"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: src/web
      - id: deploy
        uses: actions/deploy-pages@v5
