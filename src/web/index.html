<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>FantaOracle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="tool.css?v=b73831cb79">
<div class="app">
  <header class="top">
    <div class="marca">
      <div class="marca-txt">
        <h1 class="brand" aria-label="FantaOracle"><span>Fanta</span><svg class="o-sfera" id="o-sfera" viewBox="-80 -64 160 128" aria-hidden="true">
          <g class="dietro"><path class="traccia" d="M-68 0A68 17 0 0 1 68 0" transform="rotate(-17)"/></g>
          <image class="img-v" href="o-sfera.png" x="-50" y="-50" width="100" height="100"/>
          <image class="img-a" href="o-sfera-asta.png" x="-50" y="-50" width="100" height="100"/>
          <g class="davanti"><path class="traccia" d="M-68 0A68 17 0 0 0 68 0" transform="rotate(-17)"/></g>
          <g class="scintille">
            <path d="M0-6 1.3-1.3 6 0 1.3 1.3 0 6-1.3 1.3-6 0-1.3-1.3Z" transform="translate(47 -46)"/>
            <path d="M0-6 1.3-1.3 6 0 1.3 1.3 0 6-1.3 1.3-6 0-1.3-1.3Z" transform="translate(-54 38) scale(.7)"/>
            <path d="M0-6 1.3-1.3 6 0 1.3 1.3 0 6-1.3 1.3-6 0-1.3-1.3Z" transform="translate(62 30) scale(.55)"/>
          </g>
        </svg>racle</h1>
        <div class="meta" id="meta">Carico i dati…</div>
      </div>
    </div>
    <div class="tabellone" id="tabellone"></div>
    <div class="budget" id="budget"></div>
    <div id="asta-ctl"></div>
  </header>
  <nav class="tabs" role="tablist">
    <button id="tab-asta" role="tab" aria-selected="false" data-view="asta" hidden>Asta</button>
    <button id="tab-listone" role="tab" aria-selected="true" data-view="listone"><span class="solo-desk">Listone e rosa</span><span class="solo-mob">Listone</span></button>
    <button id="tab-rosa" class="solo-mob" role="tab" aria-selected="false" data-view="rosa">La mia rosa</button>
  </nav>

  <main class="main" id="main" data-view="listone">
    <section class="pane p-listone" aria-label="Listone">
      <div class="tools">
        <input id="q" type="search" placeholder="Cerca un giocatore" aria-label="Cerca un giocatore">
        <div class="seg" id="ruoli" role="group" aria-label="Ruolo">
          <button data-r="" aria-pressed="true">Tutti</button>
          <button data-r="P" aria-pressed="false">P</button>
          <button data-r="D" aria-pressed="false">D</button>
          <button data-r="C" aria-pressed="false">C</button>
          <button data-r="A" aria-pressed="false">A</button>
        </div>
        <select id="sq" aria-label="Squadra"><option value="">Tutte le squadre</option></select>
        <input id="pmax" type="number" min="1" placeholder="Prezzo max" aria-label="Prezzo atteso massimo">
        <select id="salute" aria-label="Infortuni" title="Indisponibili di oggi (SosFanta e Transfermarkt) e propensione agli infortuni dallo storico">
          <option value="">Tutti, anche infortunati</option>
          <option value="disponibili">Solo disponibili</option>
          <option value="sani">Disponibili e non fragili</option>
          <option value="fuori">Solo indisponibili</option>
          <option value="fragili">Solo fragili o delicati</option>
        </select>
        <label class="toggle"><input id="hide" type="checkbox"><span id="hide-lbl">Nascondi gli esclusi</span></label>
        <label class="toggle strat-tg" title="Per guardare il listone senza influenze, prima dell'asta: toglie i giocatori che hai gia' in rosa e quelli che l'algoritmo ti suggerisce in giallo"><input id="hide-strat" type="checkbox"><span id="hide-strat-lbl">Nascondi la mia strategia</span></label>
        <span class="count" id="count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th title="Posizione nell'ordinamento scelto, dentro il ruolo selezionato">#</th>
            <th class="l">R</th>
            <th class="f" data-k="fa" title="Fascia secondo la guida all'asta di SOS Fanta: ordina per fascia. Passa il mouse sul pallino per la legenda">F</th>
            <th class="l" data-k="nome">Giocatore</th>
            <th class="l hide-s" data-k="sq">Squadra</th>
            <th data-k="pg" title="Punti attesi a giornata: presenze x fantavoto atteso">Pt/g</th>
            <th data-k="fm" class="hide-s" title="Fantavoto atteso quando gioca">FM att.</th>
            <th data-k="pv" class="hide-s" title="Probabilita' di prendere voto">Pres.</th>
            <th data-k="qa" class="hide-s" title="Quotazione attuale Fantacalcio.it">QA</th>
            <th data-k="val" title="Quanto vale per noi, in crediti">Valore</th>
            <th data-k="pa" title="Prezzo atteso nella nostra asta">Prezzo</th>
            <th data-k="aff" title="Valore meno prezzo atteso">Affare</th>
            <th></th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="13" class="l loading">Carico il listone…</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="pane p-rosa" aria-label="La mia rosa">
      <button class="rosa-rail" id="rosa-rail" data-rosa-tg aria-expanded="false" aria-controls="rosa" title="Mostra la mia rosa"></button>
      <div class="rosa" id="rosa"></div>
    </section>

    <section class="pane p-asta" aria-label="Asta">
      <div class="asta">
        <div>
          <div class="card" id="chiamata">
            <h2>Giocatore chiamato</h2>
            <div class="giro" id="giro"></div>
            <div class="cerca">
              <input id="cerca-asta" type="search" autocomplete="off" placeholder="Scrivi il nome del giocatore chiamato" aria-label="Giocatore chiamato"
                role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="risultati">
              <div class="risultati" id="risultati" role="listbox" aria-label="Giocatori liberi" hidden></div>
            </div>
            <div id="chiamato"></div>
          </div>
          <div class="card" id="mercato"></div>
        </div>
        <div>
          <div class="card" id="squadre"></div>
          <div class="card" id="occasioni"></div>
          <div class="card" id="log"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="overlay" id="overlay" hidden></div>

<script src="scripts/stato.js?v=a8210e03a8"></script>
<script src="scripts/ottimizzatore.js?v=2119f4f757"></script>
<script src="scripts/calendario.js?v=17731d3bd2"></script>
<script src="scripts/filtri.js?v=1e142ba9d9"></script>
<script src="scripts/infortuni.js?v=75afd1967a"></script>
<script src="scripts/listone.js?v=05e0005186"></script>
<script src="scripts/rosa.js?v=65948c4637"></script>
<script src="scripts/lega.js?v=85db09ada0"></script>
<script src="scripts/formazione.js?v=ff79b20c9a"></script>
<script src="scripts/scheda.js?v=38d2bcd7d8"></script>
<script src="scripts/asta-stato.js?v=589440df55"></script>
<script src="scripts/giro.js?v=dd930228fc"></script>
<script src="scripts/mercato.js?v=60a4071fee"></script>
<script src="scripts/asta.js?v=45a2809a52"></script>
<script src="scripts/chiamata.js?v=af5cb20569"></script>
<script src="scripts/pallone.js?v=b0ab34898d"></script>
<script src="scripts/asta-dialoghi.js?v=983bbc4346"></script>
<script src="scripts/ricerca.js?v=d9b95157c2"></script>
<script src="scripts/eventi.js?v=db6bfea266"></script>
<script src="scripts/titolo.js?v=f252349d43"></script>
<script src="scripts/avvio.js?v=c2265048c5"></script>

</body>
</html>
